# Tinfoil Container Configuration - vita-ingest staging debug
#
# PUBLIC REPO. Do not commit secret values here.
# This manifest belongs only to staging tags on the staging branch.

cvm-version: 0.14.7
cpus: 2
memory: 4096

networks:
  public:
    # CVM >= 0.11 isolates containers by default (egress: closed). The service calls
    # Supabase, Tinfoil inference/attestation, Sentry and other HTTPS APIs.
    egress: open

containers:
  - name: vita-ingest
    networks: [public]
    image: "ghcr.io/vitadao/vita-ingest:sha-a9317a8@sha256:1f2626129557159eb27fb1b2c46f650e890bd323899cfb751719088cd0fe4b4d"

    env:
      - PORT: "8080"
      - TINFOIL_PUBLIC_URL: "https://staging-vita-ingest.debug.vitality-now.containers.tinfoil.dev"
      - VITA_INGEST_CORS_ORIGINS: "https://staging-app.vitadao.com"
      # Inference model for lab parsing + screening-report summaries. Must be
      # a model that exists on inference.tinfoil.sh — an unknown name comes
      # back as a 404, which sha-b90ab49 and earlier relay to the client as
      # if the route itself were missing.
      - TINFOIL_LAB_TEXT_MODEL: "gemma4-31b"
      # Sentry is enabled only if the vita-ingest runtime supports it and the
      # SENTRY_DSN secret is set in Tinfoil. Keep traces off by default.
      - SENTRY_ENVIRONMENT: "staging"
      - SENTRY_RELEASE: "vita-ingest@a9317a83"
      - VITA_INGEST_VERSION: "vita-ingest@a9317a83"
      - VITA_ANALYTICS_ENVIRONMENT: "staging"
      - SENTRY_TRACES_SAMPLE_RATE: "0"
      # OAuth callbacks redirect the browser back only to these app origins.
      - DEFAULT_FRONTEND_URL: "https://staging-app.vitadao.com"
      - ALLOWED_REDIRECT_ORIGINS: "https://staging-app.vitadao.com,http://localhost:8080,vita://dashboard"

    secrets:
      # GHCR pull token for ghcr.io/vitadao/vita-ingest.
      - VITA_INGEST_GHCR_TOKEN

      # The runtime aliases these staging names onto the unprefixed names it
      # uses internally. Never mount production Supabase credentials here.
      - STAGING_SUPABASE_URL
      - STAGING_SUPABASE_PUBLISHABLE_KEY
      - STAGING_SUPABASE_SECRET_KEY
      - STAGING_CONNECTION_TOKEN_KEK

      # Tinfoil Private Inference / document conversion for raw lab parsing.
      - TINFOIL_API_KEY

      # Sentry error monitoring. DSN is a secret in Tinfoil, never committed.
      - SENTRY_DSN

      # Wearable OAuth credentials.
      - OURA_CLIENT_ID
      - OURA_CLIENT_SECRET
      - WHOOP_CLIENT_ID
      - WHOOP_CLIENT_SECRET
      - WITHINGS_CLIENT_ID
      - WITHINGS_CLIENT_SECRET

      # Anonymous, telemetry-only staging project key.
      - POSTHOG_STAGING_PROJECT_KEY

shim:
  upstream-port: 8080
  paths:
    # Liveness
    - /health

    # Active ingest routes
    - /api/parse-lab-results
    - /api/summarize-screening-report
    - /api/transcribe
    - /api/wearable/oura/auth
    - /api/wearable/oura/callback
    - /api/wearable/oura/fetch
    - /api/wearable/whoop/auth
    - /api/wearable/whoop/callback
    - /api/wearable/whoop/fetch
    - /api/wearable/whoop/sync
    - /api/wearable/withings/auth
    - /api/wearable/withings/callback
    - /api/wearable/withings/fetch
